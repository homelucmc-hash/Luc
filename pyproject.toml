[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "lucbot"
version = "0.1.0"
description = "Offline, simulation-only trading bot"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "backtesting==0.6.5",
    "pandas>=2.2,<3",
]

[project.scripts]
lucbot = "lucbot.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
